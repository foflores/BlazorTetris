name: app-deploy-dev

on:
  workflow_dispatch:

jobs:
  app-deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet publish -c Release -o ./publish
        working-directory: ./BlazorTetris

      - name: Configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY }}
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::412433735452:role/org-development-role-iac-43dcbd2

      - name: Deploy to aws
        run: aws s3 sync ./publish/wwwroot s3://blazortetris-dev-bucket-source-c76a7dc --delete
        working-directory: ./BlazorTetris

      - name: Invalidate cdn
        run: aws cloudfront create-invalidation --distribution-id E3L9M54U7AHHOS --paths "/*"
